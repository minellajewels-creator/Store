name: Bake Index
on:
  workflow_dispatch:
  push:
    paths:
      - 'bake/bake-index.js'
      - 'bake/html-fragments.js'
      - 'bake/shared-js.js'
      - 'assets/css/style.css'

permissions:
  contents: write

jobs:
  bake-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bake index.html
        run: node bake.js index
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: bake index [skip ci]"
          git push
